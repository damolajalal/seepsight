name: Phase 7 hybrid web checks

on:
  push:
    branches:
      - feature/company-auth
      - feature/phase8-unified-hybrid-assistant
  pull_request:
    branches:
      - feature/company-auth
      - fix/ask-hybrid-ai-reliability

jobs:
  hybrid-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-hybrid-ai
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Run hybrid web tests
        run: npm test
      - name: Build production web app
        run: npm run build
