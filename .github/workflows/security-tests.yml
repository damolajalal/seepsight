name: Python security tests

on:
  push:
    branches:
      - main
      - feature/company-auth
      - feature/phase8-unified-hybrid-assistant
      - feature/dataset-management-and-connectors
  pull_request:
    branches:
      - main
      - feature/company-auth
      - fix/ask-hybrid-ai-reliability
      - feature/hybrid-ai-native-ask

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "streamlit>=1.56" firebase-admin

      - name: Run company authorization tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
