# Trigger full regression validation for Ask Hybrid AI workspace handoff.
name: Python detection and regression tests

on:
  push:
    branches:
      - feature/company-auth
  pull_request:
    branches:
      - feature/company-auth
  workflow_dispatch:

jobs:
  detection-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run complete Python test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
